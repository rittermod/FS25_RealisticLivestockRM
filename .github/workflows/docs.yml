name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/user-guide/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @mermaid-js/mermaid-cli

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install WeasyPrint system libraries (PDF export)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0

      - run: pip install mkdocs-material mkdocs-mermaid-to-svg mkdocs-to-pdf

      # Render with the runner's own Chrome, the binary the plugin used to pick up
      # by itself. command -v fails the step if the image ever drops it, rather
      # than silently falling back to Puppeteer's bundled build.
      - name: Point Puppeteer at the runner's Chrome
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
