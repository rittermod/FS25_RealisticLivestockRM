name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'puppeteer-config.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Mermaid CLI 12 declares Node 22.13 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g @mermaid-js/mermaid-cli@12.0.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'

      - name: Install the PDF body font
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - run: pip install -r docs/tooling/requirements.txt

      # Render with the runner's own Chrome.
      # puppeteer-config.json must not gain --single-process or --no-zygote: Chrome 151
      # dies on startup with those ("Protocol error (Target.setDiscoverTargets): Target
      # closed"), which reads like a broken diagram but is not one.
      - name: Point Puppeteer at the runner's Chrome
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - run: python docs/tooling/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site/site/

      - id: deployment
        uses: actions/deploy-pages@v4
