site_name: Realistic Livestock RM
site_description: User documentation for the Realistic Livestock RM mod for Farming Simulator 25
site_url: https://rittermod.github.io/FS25_RealisticLivestockRM/

repo_url: https://github.com/rittermod/FS25_RealisticLivestockRM
repo_name: FS25_RealisticLivestockRM

docs_dir: docs/user-guide

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.tooltips

plugins:
  - to-pdf
  - search
  - mermaid-to-svg:
      renderer: mmdc
      # Without this the plugin writes its own Puppeteer config, and on CI it adds
      # --single-process --no-zygote. Chrome 151 (GitHub runner image 20260810)
      # dies on startup with those, so every build failed on the first diagram
      # ("Protocol error (Target.setDiscoverTargets): Target closed"). Our file is
      # the plugin's own default arg set minus that pair.
      puppeteer_config: puppeteer-config.json
      mermaid_config:
        # Render diagram labels as native SVG <text>, not HTML in <foreignObject>.
        # WeasyPrint (PDF export) cannot render foreignObject, so htmlLabels: true
        # drops all flowchart/class text from the PDF. xy-charts already use <text>.
        htmlLabels: false
        flowchart:
          htmlLabels: false
        class:
          htmlLabels: false
        theme: base
        themeVariables:
          xyChart:
            backgroundColor: "#f8f8f8"
            titleColor: "#333333"
            xAxisLabelColor: "#333333"
            xAxisTitleColor: "#333333"
            yAxisLabelColor: "#333333"
            yAxisTitleColor: "#333333"
            xAxisLineColor: "#666666"
            yAxisLineColor: "#666666"

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences

nav:
  - Home: index.md
  - Overview: overview.md
  - Factsheets:
      - Cattle: factsheet-cattle.md
      - Pigs: factsheet-pigs.md
      - Sheep & Goats: factsheet-sheep.md
      - Horses: factsheet-horses.md
      - Chickens: factsheet-chickens.md
  - Guides:
      - Genetics: guide-genetics.md
      - Breeding & Reproduction: guide-breeding.md
      - Diseases: guide-diseases.md
      - Saved Filters: guide-saved-filters.md
      - Herdsman Automation: guide-herdsman.md
      - Animal Packs: guide-animal-packs.md
  - Maps:
      - Hof Bergmann: map-hof-bergmann.md
      - Witcombe: map-witcombe.md
      - Le Mechet: map-le-mechet.md
  - Customize:
      - Creating Animal Packs: guide-creating-packs.md
  - FAQ: faq.md
  - Reference:
      - Breeding Stats: reference-breeding.md
      - Settings: reference-settings.md
      - Mod Compatibility: reference-mod-compatibility.md
